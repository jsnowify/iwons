name: iwons-java
services:
  server:
    build: .
    image: iwons-java-runtime:judge0-1.13.1-isolate-2.2.1
    volumes:
      - ../../artifacts/judge0-local/judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    cgroup: host
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  workers:
    image: iwons-java-runtime:judge0-1.13.1-isolate-2.2.1
    pull_policy: never
    command: ["/api/scripts/workers"]
    volumes:
      - ../../artifacts/judge0-local/judge0.conf:/judge0.conf:ro
    privileged: true
    cgroup: host
    depends_on:
      - server
    restart: unless-stopped
  db:
    image: postgres:16.2
    env_file: ../../artifacts/judge0-local/judge0.conf
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'exec docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: ../../artifacts/judge0-local/judge0.conf
    restart: unless-stopped
volumes:
  data:
