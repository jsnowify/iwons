name: Application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure ephemeral authentication secret
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'AUTH_SECRET=' + require('node:crypto').randomBytes(32).toString('base64') + '\n')"
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
